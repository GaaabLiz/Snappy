[project]
name = "snappy"
version = "0.3.0"
description = "Add your description here"
requires-python = ">=3.12"
authors = [
    {name = "Gabliz", email = "gabliz.dev@gmail.com"},
]
dependencies = [
    "loguru>=0.7.3",
    "loguru-logging-intercept>=0.1.5",
    "pylizlib>=1.0.4",
    "pyside6>=6.11.0",
    "pyside6-fluent-widgets[full]>=1.11.2",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["snappy*"]


[project.optional-dependencies]
qtfw = [
    "pylizlib[qtfw]>=1.0.4",
]

[dependency-groups]
dev = [
    "ty",
    "pdoc",
    "pytest",
    "pytest-cov",
    "ruff",
    "pyinstaller>=6.22.2",
    "pytest-qt>=4.5.0",
]

